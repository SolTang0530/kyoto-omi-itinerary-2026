    .tabs{display:flex;flex-direction:row;flex-wrap:nowrap;gap:8px;padding:10px 20px;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;scroll-snap-type:x proximity}.tab{display:flex;flex:0 0 auto;align-items:center;gap:7px;min-width:190px;max-width:260px;padding:5px 7px;border-radius:10px;scroll-snap-align:start}.route-select{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0;width:100%;border:0;background:transparent;color:inherit;text-align:left;font:inherit;cursor:pointer;padding:5px}.route-select strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.route-select small{display:inline;flex:none;margin:0;white-space:nowrap}.drag-handle{flex:none;touch-action:none;cursor:grab;border:1px solid #c9d8d1;border-radius:6px;background:#eff5f1;color:#41675d;font:inherit;font-size:14px;font-weight:800;padding:5px 7px;line-height:1}.drag-handle:active{cursor:grabbing}.tab.active .drag-handle{background:#426256;color:#fff;border-color:#648578}.stop .drag-handle{margin-left:auto}.stop-top{align-items:center}.drag-ghost{position:fixed;z-index:9999;pointer-events:none;max-width:240px;min-width:130px;padding:10px 14px;background:#163d35;color:#fff;border-radius:10px;box-shadow:0 10px 30px #14241e55;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.drop-target{outline:3px dashed #d66742;outline-offset:3px}.group{min-height:48px}.empty-drop{font-size:11px;color:#8da19b;border:1px dashed #d4dfda;border-radius:8px;padding:8px 10px;margin-left:33px}.leg-distance{margin:7px 0 10px 33px;font-size:11px;font-weight:700;color:#476b62}.map-state{position:absolute;left:14px;top:14px;z-index:505;padding:7px 10px;border-radius:7px;background:#fffffff2;color:#47615c;font-size:11px;border:1px solid #d7e2da;max-width:250px}.map-state:empty{display:none}.map-pin{width:27px;height:27px;border:2px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-w     .regions{display:flex;gap:8px;overflow-x:auto;white-space:nowrap;scrollbar-width:thin;margin-top:16px;padding-bottom:3px}.region-tab,.region-add{flex:none;border:1px solid #d9e0dd;border-radius:999px;background:#fff;color:#355c55;padding:7px 15px;font:inherit;font-size:12px;font-weight:750;cursor:pointer}.region-tab[aria-current="page"]{background:#315f53;color:#fff;border-color:#315f53}.region-add{border-style:dashed}.map-pin{width:31px;height:31px;background:#fff!important;border:2px solid var(--pin-color,#315f53);color:var(--pin-color,#315f53);padding:5px}.map-pin svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.map-pin.food{--pin-color:#ad6738}.map-pin.home{--pin-color:#385f97}.map-pin.sight{--pin-color:#315f53}.map-pin.home{width:35px;height:35px}.map-icon{display:inline-flex;width:17px;height:17px;vertical-align:middle;color:#315f53}.map-icon svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.map-icon.food{color:#ad6738}.map-icon.home{color:#385f97}.route-name-edit{width:100%;font:inherit;font-size:23px;font-weight:700;color:var(--ink);border:1px solid #cbd9d3;border-radius:7px;padding:5px 8px}.meal-editor textarea:placeholder-shown{min-height:44px}@media(max-width:780px){.regions{margin-top:12px}}

<body>
  <header class="top"><div class="eyebrow">JAPAN · 2026.09.29—10.05</div><div class="headline"><div><h1 id="regionTitle">京都｜可编辑路线图</h1><p class="sub">从安土出发 · 按 ⠿ 拖动路线和景点，可修改日期与时间</p></div><span class="badge">近江八幡景点待清单确认</span></div><nav class="regions" id="regions" aria-label="切换地区"></nav></header>
  <nav class="tabs" id="tabs" aria-label="切换路线"></nav>
  <main class="layout"><section class="panel" id="panel" aria-live="polite"></section><div class="map-wrap"><div id="map" class="map" role="group" aria-label="景点地图"></div><div id="mapState" class="map-state" aria-live="polite"></div><div id="mapDetail" class="map-detail" aria-live="polite"></div><div class="legend"><i></i>虚线与距离均为直线示意</div><div class="map-note"><strong>出行口径</strong>09:00–10:00 出门，午晚餐各留 1–2 小时；晚间约 22:00 回住处。真实底图需要联网；直线距离不等于步行或车程。</div></div></main>
  <dialog id="gallery" class="gallery" aria-labelledby="galleryTitle"><div class="gallery-head"><h3 id="galleryTitle">景点照片</h3><button class="gallery-close" type="button" onclick="closeGallery()" aria-label="关闭照片画廊">×</button></div><div id="galleryMain" class="gallery-main"></div><div class="gallery-bottom"><div id="galleryCaption" class="gallery-caption"></div><div id="galleryThumbs" class="gallery-thumbs" aria-label="选择照片"></div><div class="gallery-actions"><label class="upload-label">＋ 添加自己的照片<input id="galleryUpload" type="file" accept="image/*" multiple hidden></label><span class="gallery-hint">本地照片仅在本次打开期间显示</span><span id="galleryCounter" class="gallery-counter"></span></div></div></dialog>
  <dialog id="addDialog" class="add-dialog" aria-labelledby="addTitle"><div class="gallery-head"><h3 id="addTitle">添加地点</h3><button class="gallery-close" type="button" onclick="closeAddDialog()" aria-label="关闭添加地点窗口">×</button></div><form id="addForm" class="add-form" onsubmit="addSpot(event)"><label class="full">从已有景点填入<select id="addLibrary" onchange="fillSpotTemplate()"><option value="">手动填写新地点</option></select></label><label class="full">地点名称<input id="addName" required maxlength="80" placeholder="例如：午餐餐厅或新景点"></label><label>类型<select id="addKind" onchange="toggleAddPriority()"><option value="sight">景点</option><option value="food">餐饮</option><option value="home">住所</option></select></label><label>时段<select id="addGroup"></select></label><label id="priorityLabel">优先级<select id="addPriority"><option value="可去">可去</option><option value="想去">想去</option><option value="必去">必去（至少 2 小时）</option></select></label><label>开始时间<input id="addStart" type="time" required></label><label>结束时间<input id="addEnd" type="time" required></label><label class="full">简要说明<textarea id="addDesc" maxlength="300" placeholder="游览、用餐或交通说明"></textarea></label><label>纬度（选填）<input id="addLat" type="number" min="-90" max="90" step="any" placeholder="例如 35.03959"></label><label>经度（选填）<input id="addLng" type="number" min="-180" max="180" step="any" placeholder="例如 135.72951"></label><label class="full">地点资料链接（选填）<input id="addUrl" type="url" placeholder="https://..."></label><div class="hint full">餐饮点需要填写经纬度才会显示在地图上。住宿基点使用安土站附近的示意位置，不显示具体住址。</div><div class="actions full"><button class="edit-btn" type="button" onclick="closeAddDialog()">取消</button><button class="edit-btn primary" type="submit">添加到路线</button></div></form></dialog>
  <script>
  const baseRoutes = [{"id":"west","date":"9/29 · 周二","short":"京都西部","title":"桂离宫 · 西芳寺 · 祐斋亭","color":"#8b6b45","meta":"已核对原清单 · 3 个景点 · 必去 1 处","intro":"以桂离宫的预约场次为中心，午后安排同在西侧的西芳寺；祐斋亭只在预约时间衔接时加入。","alert":"桂离宫标注“必去”，为它保留 10:30–12:30 共 2 小时现场时段；但宫内厅规定跟团参观约 60 分钟且不能自行延长。10:30 报到、11:00 导览只是示例，须以实际预约为准。","groups":[{"label":"上午 · 预约锚点","items":[{"n":"桂离宫","time":"10:30–12:30","lat":34.98406,"lng":135.7102,"desc":"必去。预留两小时现场时段；正式导览约 60 分钟，其余为报到和候场，不能在园内自行延长。","tags":["必去 · 2 小时现场时段","导览约 60 分钟","提前预约"],"url":"https://kyoto-gosho.kunaicho.go.jp/katsura-rikyu/visit"}]},{"label":"下午 · 西侧庭园","meal":"12:30–13:45 午餐","items":[{"n":"西芳寺","time":"14:00–15:15","lat":34.99232,"lng":135.6836,"desc":"想去。按预约场次参拜庭园；抢不到合适场次时直接前往下一站。","tags":["想去","预约时间决定能否加入"],"url":"https://intosaihoji.com/faq/"},{"n":"嵐山祐斋亭","time":"16:15–17:00","lat":35.0121,"lng":135.675,"desc":"想去。室内观景与染色工房；与西芳寺场次冲突时二选一。","tags":["想去","预约优先","营业时间待确认"],"url":"https://www.yusai.kyoto/"}]},{"label":"晚上","meal":"18:00–19:30 晚餐，随后返回安土；预计约 21:30–22:00 到住处","items":[]}]},{"id":"north","date":"10/1 · 周四","short":"御苑与金阁寺","title":"京都迎宾馆 · 鹿苑寺","color":"#2d7796","meta":"已核对原清单 · 4 个地点 · 必去 2 处","intro":"把必须预约的京都迎宾馆放在上午，金阁寺留在晴日下午。两处之间留午餐和移动时间。","alert":"京都迎宾馆和鹿苑寺均标注“必去”。迎宾馆保留 10:30–12:30 共 2 小时现场时段，官方导览约 90 分钟；鹿苑寺安排完整 15:00–17:00 游览。迎宾馆须先确认 10/1 开放及票额。","groups":[{"label":"上午 · 御苑","items":[{"n":"京都迎宾馆","time":"10:30–12:30","lat":35.02528,"lng":135.76562,"desc":"必去。示例为 11:00–12:30 官方导览，10:30 到场报到，合计两小时现场时段；实际按预约场次调整。","tags":["必去 · 2 小时现场时段","导览约 90 分钟","提前预约"],"url":"https://www.geihinkan.go.jp/kyoto/visit/guided_tours/"}]},{"label":"下午 · 御苑与金阁寺","meal":"12:30–13:30 午餐","items":[{"n":"京都御苑","time":"13:30–13:50","lat":35.0242,"lng":135.762,"desc":"可去。迎宾馆外的贴邻公园，短走后转车。","tags":["可去","贴邻迎宾馆"],"url":"https://www.env.go.jp/garden/kyotogyoen/"},{"n":"鹿苑寺（金阁寺）","time":"15:00–17:00","lat":35.03959,"lng":135.72951,"desc":"必去。原清单注明最好在晴天下午去；需在 17:00 关门前完成。","tags":["必去 · 2 小时游览","晴日下午优先","17:00 关门"],"url":"https://www.shokoku-ji.jp/kinkakuji/faq/"}]},{"label":"晚上 · 市中心","meal":"18:00–19:30 晚餐","items":[{"n":"新风馆","time":"19:30–20:15","lat":35.0089,"lng":135.7587,"desc":"可去。返程前逛街或休息；店铺时间出发前核对。","tags":["可去","购物休息"],"url":"https://shinpuhkan.jp/"}]}]},{"id":"east","date":"10/3 · 周六（10/2 可换）","short":"叡山与东山","title":"瑠璃光院 · 清水寺 · 坡道","color":"#d66742","meta":"已核对原清单 · 6 个景点 · 必去 1 处","intro":"瑠璃光院 2026 年秋季从 10/1 开放，安排在北侧上午；下午沿东山前往清水寺和两段坡道。跨片区移动较长。","alert":"瑠璃光院标注“必去”，预留 10:45–12:45 两小时；清水寺也留两小时。瑠璃光院 9/29 尚未进入 2026 年秋季开放期，不能放在京都第一天。若当天交通延误，优先删去南禅寺短停。","groups":[{"label":"上午 · 八濑","items":[{"n":"瑠璃光院","time":"10:45–12:45","lat":35.0658,"lng":135.8058,"desc":"必去。2026 年秋季特别参拜自 10/1 开始，10:00–17:00 开放。","tags":["必去 · 2 小时游览","10/1 起开放","雨后庭园可考虑"],"url":"https://rurikoin.komyoji.com/"}]},{"label":"下午 · 东山","meal":"12:45–13:45 午餐，随后跨片区移动约 1 小时","items":[{"n":"南禅寺","time":"14:45–15:15","lat":35.01162,"lng":135.79268,"desc":"原清单景点。短停三门与水路阁；若赶不上清水寺入场，可跳过。","tags":["原清单","时间可压缩"],"url":"https://www.nanzenji.or.jp/"},{"n":"清水寺","time":"15:45–17:45","lat":34.99442,"lng":135.78448,"desc":"原清单景点，预留完整两小时；进场和闭门时间仍须临行前确认。","tags":["2 小时游览","晴天傍晚优先"],"url":"https://www.kiyomizudera.or.jp/"},{"n":"三年坂","time":"17:45–18:10","lat":34.9964,"lng":135.782,"desc":"可去。清水寺下行的街巷。","tags":["可去","步行贴邻"],"url":"https://ja.kyoto.travel/"},{"n":"二年坂","time":"18:10–18:30","lat":34.998,"lng":135.7808,"desc":"可去。与三年坂连成一段步行。","tags":["可去","步行贴邻"],"url":"https://ja.kyoto.travel/"},{"n":"八坂塔","time":"18:30–18:45","lat":34.9983,"lng":135.7801,"desc":"可去。外观拍照即可。","tags":["可去","外观短停"],"url":"https://ja.kyoto.travel/"}]},{"label":"晚上","meal":"19:00–20:15 晚餐，之后返回安土；预计约 22:00 到住处","items":[]}]}];
  const DATE_OPTIONS=[['2026-09-29','9/29 · 周二'],['2026-09-30','9/30 · 周三'],['2026-10-01','10/1 · 周四'],['2026-10-02','10/2 · 周五'],['2026-10-03','10/3 · 周六'],['2026-10-04','10/4 · 周日'],['2026-10-05','10/5 · 周一']];
  const DEFAULT_DATES={west:'2026-09-29',north:'2026-10-01',east:'2026-10-03'};
  const STORAGE_KEY='kyoto-omi-route-editor-v1';
  // 公开地图以安土站附近代表示意出发点，避免暴露住处的精确坐标。
  const KYOTO_HOME={n:'住处（安土站附近示意）',kind:'home',lat:35.1424,lng:136.1337,time:'出发 / 返回'};
  const ICONS={sight:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h4l2-2h4l2 2h4v12H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',food:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13c4 4 12 4 16 0M6 13c0 4 2 6 6 6s6-2 6-6M4 5l4 3M8 4l4 3M3 3l7 8"/></svg>',home:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-8 9 8v10H3zM9 21v-7h6v7"/></svg>'};
  const clone=x=>JSON.parse(JSON.stringify(x));
  function freshRoutes(){return clone(baseRoutes).map(r=>({...r,region:'京都',dateKey:DEFAULT_DATES[r.id]}));}
  function loadRoutes(){
    try{const data=JSON.parse(localStorage.getItem(STORAGE_KEY));if(!Array.isArray(data)||data.length<baseRoutes.length)return freshRoutes();
      if(baseRoutes.some((base,i)=>data[i]?.id!==base.id||data[i]?.groups?.length!==base.groups.length)||data.some(r=>!DATE_OPTIONS.some(d=>d[0]===r.dateKey)||!Array.isArray(r.groups)||!r.groups.every(g=>Array.isArray(g.items))))return freshRoutes();
      return data.map((r,i)=>i<baseRoutes.length?{...baseRoutes[i],region:'京都',dateKey:r.dateKey,groups:r.groups.map((g,j)=>({...baseRoutes[i].groups[j],meal:typeof g.meal==='string'?g.meal:baseRoutes[i].groups[j].meal,items:g.items.map(s=>({...s,tags:Array.isArray(s.tags)?s.tags:[]}))}))}:{...r,region:r.region||'自定义地区'});
    }catch{return freshRoutes();}
  }
  let routes=loadRoutes(),active=0,activeRegion='京都',currentStops=[],undoStack=[],notice='';
  const $=s=>document.querySelector(s);
  function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function safeHref(url){try{const parsed=new URL(url);return parsed.protocol==='https:'?parsed.href:'';}catch{return '';}}
  function dateLabel(key){return DATE_OPTIONS.find(d=>d[0]===key)?.[1]||key;}
  function priority(s){return (s.tags||[]).some(t=>t.startsWith('必去'))?'必去':(s.tags||[]).some(t=>t.startsWith('想去'))?'想去':'可去';}
  function hasPoint(s){return Number.isFinite(Number(s.lat))&&Number.isFinite(Number(s.lng))&&s.lat!==null&&s.lng!==null&&s.lat!==''&&s.lng!=='';}
  function parseTime(time){const hit=String(time||'').match(/^(\d\d:\d\d)–(\d\d:\d\d)$/);return hit?[hit[1],hit[2]]:['10:00','11:00'];}
  function minutes(t){const [h,m]=t.split(':').map(Number);return h*60+m;}
  function straightKm(a,b){if(!hasPoint(a)||!hasPoint(b))return null;const rad=Math.PI/180,dLat=(Number(b.lat)-Number(a.lat))*rad,dLng=(Number(b.lng)-Number(a.lng))*rad,lat1=Number(a.lat)*rad,lat2=Number(b.lat)*rad,h=Math.sin(dLat/2)**2+Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLng/2)**2;return 6371*2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h));}
  function distanceText(a,b){const km=straightKm(a,b);return km===null?'待定位':km<1?Math.round(km*1000)+' 米':km.toFixed(1)+' 公里';}
  function routeTitle(r){const original=baseRoutes.find(x=>x.id===r.id),names=r.groups.flatMap(g=>g.items).map(s=>s.n);return !original?(r.title||names.slice(0,3).join(' · ')||'待命名路线'):names.join('|')===original.groups.flatMap(g=>g.items).map(s=>s.n).join('|')?r.title:(names.slice(0,3).join(' · ')||r.short);}
  function mapNodes(r,stops){const home=stops.find(s=>s.kind==='home'&&hasPoint(s))||(r.region==='京都'?KYOTO_HOME:null),middle=stops.map((s,index)=>({s,index})).filter(({s})=>s.kind!=='home');return home?[{s:home,index:-1},...middle,{s:home,index:-1}]:middle;}
  function renderRegions(){const names=[...new Set(routes.map(r=>r.region||'京都'))];$('#regions').innerHTML=names.map((name,i)=>`<button class="region-tab" type="button" aria-current="${name===activeRegion?'page':'false'}" onclick="switchRegion(${i})">${esc(name)}</button>`).join('')+'<button class="region-add" type="button" onclick="addRegion()">＋ 添加地区</button>';$('#regionTitle').textContent=activeRegion+'｜可编辑路线图';}
  function switchRegion(index){const name=[...new Set(routes.map(r=>r.region||'京都'))][index],routeIndex=routes.findIndex(r=>r.region===name);if(routeIndex<0)return;activeRegion=name;render(routeIndex);}
  function addRegion(){const name=prompt('输入新地区名称（例如：奈良）','')?.trim();if(!name)return;if(routes.some(r=>r.region===name)){switchRegion([...new Set(routes.map(r=>r.region))].indexOf(name));return;}remember();const id='custom-'+Date.now();routes.push({id,region:name,short:'新路线',title:'',color:'#315f53',intro:'',alert:'',dateKey:'2026-09-30',groups:[{label:'上午',meal:'',items:[]},{label:'下午',meal:'',items:[]},{label:'晚上',meal:'',items:[]}]});activeRegion=name;active=routes.length-1;commit(`已添加「${name}」空白地区。`);}
  function changeRouteName(value){const name=value.trim();if(!name){notice='请输入路线名称。';render(active,true);return;}remember();routes[active].short=name;routes[active].title=name;commit('已修改路线名称。');}
  function remember(){undoStack.push(clone(routes));if(undoStack.length>20)undoStack.shift();}
  function commit(message){notice=message;try{localStorage.setItem(STORAGE_KEY,JSON.stringify(routes));}catch{notice+=' · 当前浏览器未允许本地保存，请勿关闭页面。';}render(active,true);}
  function init(){$('.legend').innerHTML=['sight','food','home'].map((kind,i)=>`<span class="map-icon ${kind}">${ICONS[kind]}</span> ${['景点','餐饮','住所'][i]}`).join('　')+'<br><i></i>虚线与距离均为直线示意';render(0);}
  function render(i,keepScroll=false){
    const oldTop=keepScroll?($('#panel').scrollTop||0):0;active=i;const r=routes[i];document.documentElement.style.setProperty('--route',r.color);
    activeRegion=r.region||'京都';renderRegions();
    $('#tabs').innerHTML=routes.map((x,j)=>({x,j})).filter(({x})=>x.region===activeRegion).sort((a,b)=>a.x.dateKey.localeCompare(b.x.dateKey)).map(({x,j})=>`<div class="tab ${j===i?'active':''}" data-route-index="${j}"><button class="drag-handle" type="button" onpointerdown="beginDrag(event,'route',${j})" aria-label="拖动调整${esc(x.short)}的日期顺序" title="拖动调整路线顺序">⠿</button><button class="route-select" type="button" onclick="render(${j})" aria-pressed="${j===i}"><strong>${esc(x.short)}</strong><small>${esc(dateLabel(x.dateKey))}</small></button></div>`).join('');
    const all=r.groups.flatMap(g=>g.items),must=all.filter(s=>s.kind!=='food'&&priority(s)==='必去').length,nodes=mapNodes(r,all).map(x=>x.s),legs=nodes.slice(0,-1).map((s,j)=>straightKm(s,nodes[j+1])),kmTotal=legs.reduce((sum,km)=>sum+(km||0),0),missingLegs=legs.filter(km=>km===null).length;
    let html=`<div class="route-head"><i class="route-dot"></i><h2>${esc(routeTitle(r))}</h2></div><p class="route-meta">${all.filter(s=>s.kind!=='food'&&s.kind!=='home').length} 个景点 · 必去 ${must} 处 · 闭环直线合计 ${kmTotal.toFixed(1)} 公里${missingLegs?` · ${missingLegs} 段待定位`:``} · ${esc(dateLabel(r.dateKey))}</p><div class="editbar"><label for="routeDate">路线日期</label><select id="routeDate" onchange="changeDate(active,this.value)">${DATE_OPTIONS.map(([key,label])=>`<option value="${key}" ${r.dateKey===key?'selected':''}>${esc(label)}</option>`).join('')}</select><button class="edit-btn primary" type="button" onclick="openAddDialog()">＋ 添加地点</button><button class="edit-btn" type="button" onclick="undoEdit()" ${undoStack.length?'':'disabled'}>撤销</button><button class="edit-btn" type="button" onclick="resetRoutes()">恢复原方案</button></div>${notice?`<p class="notice" role="status">${esc(notice)}</p>`:''}${r.intro?`<p class="intro">${esc(r.intro)}</p>`:''}${r.alert?`<div class="alert">原方案提示，调整日期或时间后请重新核对：${esc(r.alert)}${r.dateKey<'2026-10-01'&&all.some(s=>s.n==='瑠璃光院')?' 瑠璃光院 2026 年秋季从 10/1 开放，当前日期过早。':''}</div>`:''}${r.id.startsWith('custom-')?`<label class="meal-editor">路线名称<input class="route-name-edit" value="${esc(r.title)}" placeholder="填写路线名称" maxlength="40" onchange="changeRouteName(this.value)"></label>`:''}`;
    let idx=0;
    r.groups.forEach((g,gi)=>{html+=`<div class="group" data-group-index="${gi}"><div class="group-title">${esc(g.label)}</div>`;if(g.meal||r.id.startsWith('custom-'))html+=`<label class="meal meal-editor">餐食与转场时间<textarea rows="2" maxlength="240" placeholder="填写用餐或转场安排；地图餐饮点请用添加地点" onchange="changeMeal(${gi},this.value)">${esc(g.meal||'')}</textarea></label>`;g.items.forEach((s,si)=>{
      idx++;const [start,end]=parseTime(s.time),href=safeHref(s.url),loc=hasPoint(s);
      html+=`<article class="stop" id="stop-${idx}" data-group-index="${gi}" data-stop-index="${si}" tabindex="0" onclick="focusStop(${idx-1})" onkeydown="if(event.target===this&&(event.key==='Enter'||event.key===' ')){event.preventDefault();focusStop(${idx-1})}"><div class="stop-top"><span class="num">${idx}</span><div class="stop-title"><span class="map-icon ${esc(s.kind||'sight')}">${ICONS[s.kind]||ICONS.sight}</span> ${esc(s.n)}</div><span class="clock">${esc(s.time)}</span><button class="drag-handle" type="button" onpointerdown="beginDrag(event,'spot',${gi},${si})" onclick="event.stopPropagation()" aria-label="拖动调整${esc(s.n)}的顺序" title="拖动调整景点顺序">⠿</button></div><p class="stop-desc">${esc(s.desc||'自行添加的景点；游览信息请以官方公布为准。')}</p><div class="tags">${(s.tags||[]).map((t,k)=>`<span class="tag ${k===0?'blue':k===1?'green':''}">${esc(t)}</span>`).join('')}</div>${loc?'':'<p class="unlocated">未填写位置，地图暂不显示此点</p>'}<button class="photo-btn" type="button" onclick="event.stopPropagation();openGallery(currentStops[${idx-1}])" onkeydown="event.stopPropagation()" aria-label="查看${esc(s.n)}的照片画廊">▧ 查看照片</button>${href?`<a class="src" href="${esc(href)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">查看景点/官方信息 ↗</a>`:''}<div class="stop-edit" onclick="event.stopPropagation()"><button class="move-btn" type="button" onclick="moveStop(${gi},${si},-1)" ${idx===1?'disabled':''} aria-label="上移${esc(s.n)}">↑ 上移</button><button class="move-btn" type="button" onclick="moveStop(${gi},${si},1)" ${idx===all.length?'disabled':''} aria-label="下移${esc(s.n)}">↓ 下移</button><label class="time-edit">时间 <input type="time" value="${esc(start)}" aria-label="${esc(s.n)}开始时间" onchange="changeTime(${gi},${si},'start',this.value)"> — <input type="time" value="${esc(end)}" aria-label="${esc(s.n)}结束时间" onchange="changeTime(${gi},${si},'end',this.value)"></label><button class="remove-btn" type="button" onclick="removeStop(${gi},${si})" aria-label="移除${esc(s.n)}">移除</button></div></       const info=page.imageinfo?.[0];if(!info||!/^image\/(jpeg|png|webp)$/.test(info.mime||''))return null;
      const url=info.thumburl||info.url,source=info.descriptionurl;
      if(!url?.startsWith('https://upload.wikimedia.org/')||!source?.startsWith('https://commons.wikimedia.org/'))return null;
      return {url,source,title:(page.title||'').replace(/^File:/,''),artist:plain(info.extmetadata?.Artist?.value).slice(0,120),license:plain(info.extmetadata?.LicenseShortName?.value)};
    }).filter(Boolean).slice(0,6);
  }
  function allPhotos(){return [...(photoCache.get(galleryStop?.n)?.photos||[]),...(localPhotos.get(galleryStop?.n)||[])];}
  async function openGallery(stop){
    galleryStop=stop;galleryIndex=0;galleryStatus='正在查找照片…';$('#galleryTitle').textContent=stop.n+' · 照片';
    if(!$('#gallery').open)$('#gallery').showModal();drawGallery();
    if(photoCache.get(stop.n))return;
    try{const photos=await commonsPhotos(stop);photoCache.set(stop.n,{photos});if(galleryStop===stop)galleryStatus=photos.length?'':`Wikimedia Commons 暂无明确匹配「${stop.n}」的照片。可添加自己的照片，或打开景点资料。`;}
    catch(error){if(galleryStop===stop)galleryStatus='在线照片暂时无法加载。可稍后重试，或添加自己的照片。';}
    if(galleryStop===stop)drawGallery();
  }
  function drawGallery(){
    const photos=allPhotos(),main=$('#galleryMain'),caption=$('#galleryCaption'),thumbs=$('#galleryThumbs');
    main.replaceChildren();caption.replaceChildren();thumbs.replaceChildren();
    $('#galleryCounter').textContent=photos.length?`${Math.min(galleryIndex+1,photos.length)} / ${photos.length}`:'';
    if(!photos.length){const status=document.createElement('div');status.className='gallery-status';status.textContent=galleryStatus||'暂无可用照片。';const href=safeHref(galleryStop.url);if(href){const br=document.createElement('br'),link=document.createElement('a');link.href=href;link.target='_blank';link.rel='noopener noreferrer';link.textContent='查看景点资料 ↗';status.append(br,link);}main.append(status);return;}
    galleryIndex=Math.min(galleryIndex,photos.length-1);const pic=photos[galleryIndex];
    const img=document.createElement('img');img.src=pic.url;img.alt=galleryStop.n+'照片 '+(galleryIndex+1);img.onerror=()=>{img.alt='照片加载失败，请切换其他图片';};main.append(img);
    for(const [label,step] of [['‹',-1],['›',1]]){const button=document.createElement('button');button.type='button';button.className='gallery-arrow '+(step<0?'prev':'next');button.textContent=label;button.setAttribute('aria-label',step<0?'上一张':'下一张');button.disabled=photos.length<2;button.onclick=()=>showGalleryPhoto((galleryIndex+step+photos.length)%photos.length);main.append(button);}
    caption.textContent=pic.local?'本地照片 · 仅在本次打开期间显示':`${pic.title} · ${pic.artist||'作者见图源'} · ${pic.license||'授权见图源'} · `;
    if(pic.source){const link=document.createElement('a');link.href=pic.source;link.target='_blank';link.rel='noopener noreferrer';link.textContent='Wikimedia Commons 图源与授权 ↗';caption.append(link);}
    photos.forEach((p,i)=>{const button=document.createElement('button');button.type='button';button.className=i===galleryIndex?'active':'';button.setAttribute('aria-label',`第 ${i+1} 张照片`);button.onclick=()=>showGalleryPhoto(i);const thumb=document.createElement('img');thumb.src=p.url;thumb.alt='';thumb.loading='lazy';button.append(thumb);thumbs.append(button);});
    $('#galleryCounter').textContent=`${galleryIndex+1} / ${photos.length}`;
  }
  function showGalleryPhoto(i){galleryIndex=i;drawGallery();}
  function closeGallery(){$('#gallery').close();}
  $('#galleryUpload').addEventListener('change',event=>{const files=[...event.target.files].filter(f=>f.type.startsWith('image/'));if(!galleryStop||!files.length)return;const list=localPhotos.get(galleryStop.n)||[];files.forEach(file=>list.push({url:URL.createObjectURL(file),title:file.name,local:true}));localPhotos.set(galleryStop.n,list);galleryIndex=allPhotos().length-1;drawGallery();event.target.value='';});
  document.addEventListener('keydown',event=>{if(!$('#gallery').open)return;const count=allPhotos().length;if(count<2)return;if(event.key==='ArrowLeft'){event.preventDefault();showGalleryPhoto((galleryIndex-1+count)%count);}if(event.key==='ArrowRight'){event.preventDefault();showGalleryPhoto((galleryIndex+1)%count);}});
  window.openGallery=openGallery;window.closeGallery=closeGallery;
  window.render=render;window.focusStop=focusStop;window.addEventListener('load',init);
  </script>
</body>
</html>
